name: Build Codex Desktop for Windows

on:
  schedule:
    # 单档 UTC 21:43（北京 05:43）。schedule 调度队列在 UTC 午夜前后实测积压
    # 2~3.6 小时（cron 23:43 时实际创建 run 在 01:39~03:20 UTC），整体前移后
    # 典型延迟下北京 ~08:30 前完成构建，最差 3.6h 延迟约 09:30 完成。
    # 分钟取 :43 避开整点触发高峰（GitHub 文档：整点为高负载时段）。
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deprecated; unchanged App and embedded CLI are always skipped"
        type: boolean
        default: false
      force_build:
        description: "忽略版本未变判定，强制完整重新构建并重新上传"
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: "24"

concurrency:
  group: codex-desktop-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure 7-Zip alias
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) { choco install 7zip -y --no-progress }
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "C:\Program Files\7-Zip\7zz.exe"
          echo "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Test packaging scripts
        run: npm test

      # 轻量探测：只查商店元数据 + npm CLI 版本 + Release 标记，不下载 MSIX。
      # 版本都没变时本轮直接跳过，无变更日不再触碰商店 CDN。
      - name: Early skip check
        id: early
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: node scripts/check-windows-skip.js

      - name: Cache upstream MSIX
        if: steps.early.outputs.skip == 'false'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/codex-sync
          key: codex-msix-${{ steps.early.outputs.msix_version }}
          restore-keys: |
            codex-msix-

      - name: Sync upstream Windows app
        if: steps.early.outputs.skip == 'false'
        env:
          # runner.temp 与 node os.tmpdir() 默认不一致（D:\a\_temp vs C:\Users\...\Temp），
          # 统一后下载与 actions/cache 才能落在同一目录
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node scripts/sync-upstream.js --force --skip-mac

      - name: Read packaged app and CLI versions
        if: steps.early.outputs.skip == 'false'
        id: version
        shell: bash
        run: |
          APP_VERSION=$(node -e "const fs=require('fs');const p='src/win/_asar/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(pkg.version||'')")
          WIN_PACKAGE_VERSION=$(node -e "const fs=require('fs');const p='scripts/.versions.json';const v=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(v.win?.version||'')")
          CODEX_CLI_VERSION=$(npm view @openai/codex version --json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d)))")
          if [ -z "$APP_VERSION" ] || [ -z "$WIN_PACKAGE_VERSION" ] || [ -z "$CODEX_CLI_VERSION" ]; then
            echo "No complete Windows app and Codex CLI version set detected"
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "win_package_version=$WIN_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "codex_cli_version=$CODEX_CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION-cli-$CODEX_CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=Codex-win-x64-$APP_VERSION-cli-$CODEX_CLI_VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Check existing app-version release
        id: existing
        if: steps.early.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CODEX_CLI_VERSION: ${{ steps.version.outputs.codex_cli_version }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          EXISTING_RELEASE="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | node -e '
              const { CODEX_CLI_VERSION: cli, TAG: tag, ZIP_NAME: zip } = process.env;
              const marker = `<!-- codex-cli-version:${cli} -->`;
              let data = "";
              process.stdin.on("data", (chunk) => data += chunk);
              process.stdin.on("end", () => {
                const releases = JSON.parse(data);
                const hit = releases.find((release) => {
                  const assets = new Set((release.assets || []).map((asset) => asset.name));
                  return release.tag_name === tag &&
                    release.body?.includes(marker) &&
                    assets.has(zip) &&
                    assets.has("SHA256SUMS.txt");
                });
                if (hit) process.stdout.write(hit.tag_name);
              });
            '
          )"
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "existing_release=$EXISTING_RELEASE" >> "$GITHUB_OUTPUT"
            echo "$ZIP_NAME already exists in $EXISTING_RELEASE"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force_build requested; rebuilding"
          fi

      - name: Patch app
        if: steps.existing.outputs.skip == 'false'
        run: node scripts/patch-all.js win

      - name: Build Windows zip
        if: steps.existing.outputs.skip == 'false'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CODEX_CLI_VERSION: ${{ steps.version.outputs.codex_cli_version }}
          CODEX_WINDOWS_PACKAGE_VERSION: ${{ steps.version.outputs.win_package_version }}
        run: npm run build:win-x64

      - name: Build Windows update zip
        id: update
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node scripts/build-windows-update.js

      - name: Create checksums
        if: steps.existing.outputs.skip == 'false'
        shell: bash
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
          UPDATE_ZIP_NAME: ${{ steps.update.outputs.zip_name }}
        run: |
          cd out
          test -f "$ZIP_NAME"
          FILES=("$ZIP_NAME")
          if [ -n "$UPDATE_ZIP_NAME" ]; then
            test -f "$UPDATE_ZIP_NAME"
            FILES+=("$UPDATE_ZIP_NAME")
          fi
          sha256sum "${FILES[@]}" > SHA256SUMS.txt

      - name: Publish release
        if: steps.existing.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          WIN_PACKAGE_VERSION: ${{ steps.version.outputs.win_package_version }}
          CODEX_CLI_VERSION: ${{ steps.version.outputs.codex_cli_version }}
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
          UPDATE_ZIP_NAME: ${{ steps.update.outputs.zip_name }}
          UPDATE_BASE_TAG: ${{ steps.update.outputs.base_tag }}
          UPDATE_REASON: ${{ steps.update.outputs.reason }}
        run: |
          RELEASE_NOTES_PATH="$RUNNER_TEMP/codex-release-notes.txt"
          printf '基于 Microsoft Store Windows x64 安装包 %s 重新打包，App 版本为 %s，内含 Codex CLI %s。\n\n' \
            "$WIN_PACKAGE_VERSION" "$APP_VERSION" "$CODEX_CLI_VERSION" > "$RELEASE_NOTES_PATH"
          printf '全量包：`%s`。首次安装或跨版本更新，请解压到新目录，运行“ChatGPT.exe”。\n\n' "$ZIP_NAME" >> "$RELEASE_NOTES_PATH"
          FILES=("out/$ZIP_NAME" out/SHA256SUMS.txt)
          if [ -n "$UPDATE_ZIP_NAME" ]; then
            FILES+=("out/$UPDATE_ZIP_NAME")
            printf '增量包：`%s`，仅适用于 `%s`。完全退出程序后，解压到原程序目录并覆盖文件，再启动程序。\n\n' \
              "$UPDATE_ZIP_NAME" "$UPDATE_BASE_TAG" >> "$RELEASE_NOTES_PATH"
          else
            printf '%s\n\n' "$UPDATE_REASON" >> "$RELEASE_NOTES_PATH"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RELEASE_NOTES_PATH"
            # 同一 tag 强制重建时，清掉可能指向不同基线的旧增量资产。
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r ASSET; do
              case "$ASSET" in
                Codex-win-x64-*-update-from-*.zip) gh release delete-asset "$TAG" "$ASSET" --yes ;;
              esac
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | node -e '
            const fs = require("fs");
            const zip = process.env.ZIP_NAME;
            let data = "";
            process.stdin.on("data", (chunk) => data += chunk);
            process.stdin.on("end", () => {
              const release = JSON.parse(data);
              const files = [[zip, `out/${zip}`], ["SHA256SUMS.txt", "out/SHA256SUMS.txt"]];
              const update = process.env.UPDATE_ZIP_NAME;
              if (update) files.push([update, `out/${update}`]);
              for (const [name, file] of files) {
                const asset = (release.assets || []).find((item) => item.name === name);
                if (!asset || asset.size !== fs.statSync(file).size) {
                  throw new Error(`Release asset verification failed: ${name}`);
                }
              }
            });
          '
          printf '<!-- codex-cli-version:%s --><!-- msix-version:%s -->\n' \
            "$CODEX_CLI_VERSION" "$WIN_PACKAGE_VERSION" >> "$RELEASE_NOTES_PATH"
          gh release edit "$TAG" --title "$TAG" --notes-file "$RELEASE_NOTES_PATH"
